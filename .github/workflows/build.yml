name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test
        run: dotnet test tests/OutageLog.Tests -c Release

      - name: Build
        run: dotnet build src/OutageLog -c Release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item src/OutageLog/bin/Release/net48/OutageLog.exe dist/
          $hash = (Get-FileHash dist/OutageLog.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  OutageLog.exe" | Out-File -Encoding ascii dist/OutageLog.exe.sha256
          Get-Content dist/OutageLog.exe.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: OutageLog
          path: dist/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" dist/OutageLog.exe dist/OutageLog.exe.sha256 `
            --title "OutageLog ${{ github.ref_name }}" --notes-file .github/release-notes.md
